<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6f63e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Us">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Us</title>
<style>
:root{--bg:#f3f1ff;--card:#fff;--tx:#1f1c33;--mu:#7b7898;--ac:#6f63e8;--them:#e7e4fa;--ln:#e2dff5;--g1:#c9c2ff;--g2:#9fd0ff}
:root[data-theme=dark]{--bg:#12111d;--card:#1c1a2c;--tx:#ece9ff;--mu:#9591b5;--ac:#8c82ff;--them:#2a2742;--ln:#2e2b47;--g1:#3b3380;--g2:#25507a}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 0}
h1,h2{font-family:Georgia,serif;font-weight:600;margin:0}
button,input{font:inherit;color:inherit}
#login{max-width:340px;margin:0 auto;padding:18vh 24px 0;display:grid;gap:12px}
#login h1{font-size:44px}
input[type=email],input[type=password],input[type=text],input[type=date]{width:100%;padding:13px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--card)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:600}
.err{color:#d23c5a;min-height:1.4em;margin:0}
#main{height:100%;display:flex;flex-direction:column}
.v{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 16px}
.hero{margin:16px 0;border-radius:28px;padding:36px 20px;text-align:center;background:linear-gradient(145deg,var(--g1),var(--g2))}
.hero b{display:block;font:600 76px/1 Georgia,serif}
.hero span{display:block;margin-top:6px}
.hero small{display:block;margin-top:14px;opacity:.75}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;display:grid;gap:10px}
.card h2{font-size:20px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px;border:1px solid var(--ln);border-radius:10px;background:none}
.seg .on{background:var(--ac);border-color:var(--ac);color:#fff}
.link{background:none;border:0;color:var(--mu);padding:8px}
#chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:14px 0}
.m{max-width:78%;padding:9px 13px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.m small{display:block;font-size:11px;opacity:.6;margin-top:2px}
.m.me{align-self:flex-end;background:var(--ac);color:#fff;border-bottom-right-radius:5px}
.m.them{align-self:flex-start;background:var(--them);border-bottom-left-radius:5px}
.row{display:flex;gap:8px;padding:8px 0}.row input{flex:1}.row .btn{padding:0 18px}
#tl{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
#tl li{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--ln)}
#tl li span{flex:1;overflow-wrap:anywhere}#tl li em{color:var(--mu);font-size:12px;font-style:normal}
#tl .done span{text-decoration:line-through;color:var(--mu)}
#tl input{width:22px;height:22px;accent-color:var(--ac)}
#tl button{background:none;border:0;color:var(--mu);font-size:22px}
nav{display:flex;border-top:1px solid var(--ln);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 0;background:none;border:0;color:var(--mu);font-weight:600}
nav .on{color:var(--ac)}
#toast{position:fixed;left:16px;right:16px;bottom:80px;background:#d23c5a;color:#fff;padding:10px 14px;border-radius:12px}
</style></head><body>

<form id="login" hidden>
  <h1>Us</h1>
  <input id="em" type="email" placeholder="Email" autocomplete="username" required>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
  <p class="err" id="err"></p>
  <button class="btn">Log in</button>
</form>

<div id="main" hidden>
  <section class="v" id="v-home" style="overflow-y:auto">
    <div class="hero"><b id="days">–</b><span>days together</span><small id="names"></small></div>
    <div class="card"><h2>Our start date</h2><input type="date" id="sd"></div>
    <div class="card"><h2>Theme</h2>
      <div class="seg" id="th"><button data-v="light">Light</button><button data-v="auto">Auto</button><button data-v="dark">Dark</button></div>
      <small style="color:var(--mu)">Saved on this device only.</small></div>
    <button class="link" id="out">Log out</button>
  </section>
  <section class="v" id="v-chat" hidden>
    <div id="chat"></div>
    <form class="row" id="cf"><input id="ci" type="text" placeholder="Message" autocomplete="off" maxlength="1000"><button class="btn">Send</button></form>
  </section>
  <section class="v" id="v-tasks" hidden>
    <form class="row" id="tf"><input id="ti" type="text" placeholder="Add something to do" autocomplete="off" maxlength="200"><button class="btn">Add</button></form>
    <ul id="tl"></ul>
  </section>
  <nav><button class="on" data-t="home">Home</button><button data-t="chat">Chat</button><button data-t="tasks">To-do</button></nav>
</div>
<div id="toast" hidden></div>

<script type="module">
import cfg from "./config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,onSnapshot,addDoc,updateDoc,deleteDoc,setDoc,query,orderBy,limit,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const auth=getAuth(initializeApp(cfg)), db=getFirestore();
let me=null, meta={names:{}}, msgs=[], tasks=[], unsubs=[], stick=true, asked=false;

const bad=e=>{const t=$('#toast');t.textContent="Something went wrong ("+(e.code||e.message)+")";t.hidden=false;setTimeout(()=>t.hidden=true,4000)};
const when=t=>t&&t.toDate?t.toDate().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
const name=u=>meta.names[u]||'';

// theme
function theme(){let t=localStorage.theme||'auto';
  $$('#th button').forEach(b=>b.classList.toggle('on',b.dataset.v===t));
  if(t==='auto')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  document.documentElement.dataset.theme=t}
$$('#th button').forEach(b=>b.onclick=()=>{localStorage.theme=b.dataset.v;theme()});
matchMedia('(prefers-color-scheme:dark)').onchange=theme;theme();

// login
onAuthStateChanged(auth,u=>{unsubs.forEach(f=>f());unsubs=[];me=u;asked=false;
  $('#login').hidden=!!u;$('#main').hidden=!u;if(u)start()});
$('#login').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';
  try{await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)}
  catch{$('#err').textContent='Wrong email or password.'}};
$('#out').onclick=()=>signOut(auth);

// tabs
$$('nav button').forEach(b=>b.onclick=()=>{
  $$('nav button').forEach(x=>x.classList.toggle('on',x===b));
  $$('.v').forEach(v=>v.hidden=v.id!=='v-'+b.dataset.t);
  if(b.dataset.t==='chat'){const c=$('#chat');c.scrollTop=c.scrollHeight}});

function start(){
  unsubs.push(onSnapshot(doc(db,'settings','main'),s=>{
    meta=s.data()||{};meta.names=meta.names||{};home();
    if(!meta.names[me.uid]&&!asked){asked=true;const n=(prompt('What should we call you?')||'').trim().slice(0,30);
      if(n)setDoc(doc(db,'settings','main'),{names:{[me.uid]:n}},{merge:true}).catch(bad)}
  },bad));
  unsubs.push(onSnapshot(query(collection(db,'messages'),orderBy('ts','desc'),limit(100)),s=>{
    msgs=s.docs.map(d=>({id:d.id,...d.data()})).reverse();drawChat()},bad));
  unsubs.push(onSnapshot(query(collection(db,'tasks'),orderBy('ts','desc')),s=>{
    tasks=s.docs.map(d=>({id:d.id,...d.data()}));drawTasks()},bad));
}

function home(){
  const d=meta.start?Math.floor((Date.now()-new Date(meta.start+'T00:00:00'))/864e5):null;
  $('#days').textContent=d===null?'–':d.toLocaleString();
  $('#names').textContent=Object.values(meta.names).join(' & ');
  $('#sd').value=meta.start||'';drawTasks()}
$('#sd').onchange=e=>setDoc(doc(db,'settings','main'),{start:e.target.value},{merge:true}).catch(bad);

// chat
function drawChat(){
  const c=$('#chat'),near=stick||c.scrollHeight-c.scrollTop-c.clientHeight<80;stick=false;
  c.replaceChildren(...msgs.map(m=>{const d=document.createElement('div');
    d.className='m '+(m.uid===me.uid?'me':'them');d.textContent=m.text;
    const t=document.createElement('small');t.textContent=when(m.ts);d.append(t);return d}));
  if(near)c.scrollTop=c.scrollHeight}
$('#cf').onsubmit=async e=>{e.preventDefault();const i=$('#ci'),v=i.value.trim();if(!v)return;i.value='';
  try{await addDoc(collection(db,'messages'),{text:v,uid:me.uid,ts:serverTimestamp()})}catch(x){bad(x);i.value=v}};

// to-do
function drawTasks(){
  $('#tl').replaceChildren(...[...tasks].sort((a,b)=>a.done-b.done).map(t=>{
    const li=document.createElement('li');li.className=t.done?'done':'';
    const c=document.createElement('input');c.type='checkbox';c.checked=!!t.done;
    c.onchange=()=>updateDoc(doc(db,'tasks',t.id),{done:c.checked}).catch(bad);
    const s=document.createElement('span');s.textContent=t.text;
    const w=document.createElement('em');w.textContent=name(t.uid);
    const x=document.createElement('button');x.textContent='×';x.setAttribute('aria-label','Delete');
    x.onclick=()=>deleteDoc(doc(db,'tasks',t.id)).catch(bad);
    li.append(c,s,w,x);return li}))}
$('#tf').onsubmit=async e=>{e.preventDefault();const i=$('#ti'),v=i.value.trim();if(!v)return;i.value='';
  try{await addDoc(collection(db,'tasks'),{text:v,done:false,uid:me.uid,ts:serverTimestamp()})}catch(x){bad(x);i.value=v}};

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
